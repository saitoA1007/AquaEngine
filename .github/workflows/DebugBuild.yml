name: DebugBuild
on:
  push:
    branches:
      - master
env:
  SOLUTION_FILE_PATH: Project/AquaEngine.slnx
  CONFIGURATION: Debug
jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
    - name: Restore NuGet packages
      run: msbuild ${{env.SOLUTION_FILE_PATH}} /t:Restore /p:RestorePackagesConfig=true /p:Platform=x64,Configuration=${{env.CONFIGURATION}}
    - name: Build
      run: 
        msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=x64,Configuration=${{env.CONFIGURATION}}
